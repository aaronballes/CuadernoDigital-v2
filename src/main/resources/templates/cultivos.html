<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivos - Gestión de Parcelas</title>
    <style>
        :root {
            --primary: #2d5a27;
            --primary-light: #4a8f47;
            --primary-dark: #1e3d1a;
            --bg: #f8faf5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e8e0;
            --shadow: 0 4px 6px rgba(0,0,0,0.07);
            --radius: 12px;
            --danger: #dc3545;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header h1 { font-size: 1.25rem; }
        
        header a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }
        
        header a:hover { background: rgba(255,255,255,0.3); }
        
        main { max-width: 900px; margin: 0 auto; padding: 2rem; }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .page-header h2 { color: var(--primary); }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            background: var(--primary);
            color: white;
        }
        
        .btn:hover { background: var(--primary-light); }
        
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .table-container { overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; }
        
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: #f8faf5;
            font-weight: 600;
        }
        
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafcf8; }
        
        .actions { display: flex; gap: 0.5rem; }
        
        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        
        .btn-edit { background: var(--primary); color: white; }
        .btn-delete { background: var(--danger); color: white; }
        
        .loading, .empty {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }
        
        .empty { background: var(--card-bg); border-radius: var(--radius); }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        
        .modal-header h3 { color: var(--primary); }
        
        .close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .form-group { margin-bottom: 1rem; }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-full { width: 100%; }
        
        @media (max-width: 768px) {
            main { padding: 1rem; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌱 Cultivos</h1>
        <a href="/home">← Inicio</a>
    </header>
    
    <main>
        <div class="page-header">
            <h2>Tipos de Cultivos</h2>
            <button class="btn" onclick="abrirModalCrear()">+ Nuevo Cultivo</button>
        </div>
        
        <div class="card">
            <div id="content">
                <div class="loading">Cargando cultivos...</div>
            </div>
        </div>
    </main>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Nuevo Cultivo</h3>
                <button class="close" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="form-cultivo">
                <input type="hidden" id="cultivo-id">
                <div class="form-group">
                    <label>Nombre del Cultivo</label>
                    <input type="text" id="cultivo" required placeholder="Ej: Trigo">
                </div>
                <div class="form-group">
                    <label>Hectáreas</label>
                    <input type="number" step="0.01" id="hectareas" placeholder="Opcional">
                </div>
                <div class="form-group">
                    <label>Porcentaje</label>
                    <input type="number" step="0.01" id="porcentaje" placeholder="Opcional">
                </div>
                <button type="submit" class="btn btn-full">Guardar</button>
            </form>
        </div>
    </div>
    
    <script>
        const API = '/api/cultivos';
        
        function cargarCultivos() {
            fetch(API)
                .then(r => r.json())
                .then(data => {
                    const content = document.getElementById('content');
                    if (!data.length) {
                        content.innerHTML = '<div class="empty">No hay cultivos registrados</div>';
                        return;
                    }
                    let html = '<div class="table-container"><table><thead><tr><th>Cultivo</th><th>Hectáreas</th><th>Porcentaje</th><th>Acciones</th></tr></thead><tbody>';
                    data.forEach(c => {
                        html += `<tr>
                            <td><strong>${c.cultivo || '-'}</strong></td>
                            <td>${c.hectareas || '-'}</td>
                            <td>${c.porcentaje ? c.porcentaje + '%' : '-'}</td>
                            <td class="actions">
                                <button class="btn-sm btn-edit" onclick='editarCultivo(${JSON.stringify(c)})'>Editar</button>
                                <button class="btn-sm btn-delete" onclick="eliminarCultivo(${c.cultivoId})">Eliminar</button>
                            </td>
                        </tr>`;
                    });
                    html += '</tbody></table></div>';
                    content.innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('content').innerHTML = '<div class="empty">Error al cargar cultivos</div>';
                });
        }
        
        function abrirModalCrear() {
            document.getElementById('modal-titulo').textContent = 'Nuevo Cultivo';
            document.getElementById('form-cultivo').reset();
            document.getElementById('cultivo-id').value = '';
            document.getElementById('modal').classList.add('active');
        }
        
        function editarCultivo(c) {
            document.getElementById('modal-titulo').textContent = 'Editar Cultivo';
            document.getElementById('cultivo-id').value = c.cultivoId;
            document.getElementById('cultivo').value = c.cultivo || '';
            document.getElementById('hectareas').value = c.hectareas || '';
            document.getElementById('porcentaje').value = c.porcentaje || '';
            document.getElementById('modal').classList.add('active');
        }
        
        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        document.getElementById('form-cultivo').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('cultivo-id').value;
            const cultivo = {
                cultivo: document.getElementById('cultivo').value,
                hectareas: parseFloat(document.getElementById('hectareas').value) || null,
                porcentaje: parseFloat(document.getElementById('porcentaje').value) || null
            };
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? API + '/' + id : API;
            
            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cultivo)
            }).then(r => { if (r.ok) { cerrarModal(); cargarCultivos(); } });
        });
        
        function eliminarCultivo(id) {
            if (confirm('¿Eliminar este cultivo?')) {
                fetch(API + '/' + id, { method: 'DELETE' })
                    .then(r => { if (r.ok) cargarCultivos(); });
            }
        }
        
        cargarCultivos();
    </script>
</body>
</html>
