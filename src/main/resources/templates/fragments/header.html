<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .header {
            background: #2c5f2d;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 1.3em;
            margin: 0;
        }
        .header h1 a {
            color: white;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.3);
        }
        .nav-links a.active {
            background: rgba(255,255,255,0.3);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div th:fragment="header" class="header">
        <h1><a href="/home">🌾 Gestión de Parcelas</a></h1>
        <div class="nav-links">
            <a href="/parcelas">Parcelas</a>
            <a href="/ejercicios">Ejercicios</a>
            <a href="/cultivos">Cultivos</a>
            <a href="/detalles">Detalles</a>
            <a href="/propietarios">Propietarios</a>
        </div>
    </div>
</body>
</html>
